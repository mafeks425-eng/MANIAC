name: Build mod

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # позволяет запустить сборку кнопкой вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: dbdgen-jar
          path: build/libs/*.jar
